name: Run Bot

on:
  schedule:
    - cron: "13 2 * * 1-5"
    - cron: "30 4 * * 1-5"
    - cron: "35 8 * * 1-5"
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil file
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install library
        run: pip install -r requirements.txt

      - name: Jalankan bot
        run: python botgit.py

        env:
          TOKEN: ${{ secrets.TOKEN }}
          RUN_BOT: ${{ secrets.RUN_BOT }}